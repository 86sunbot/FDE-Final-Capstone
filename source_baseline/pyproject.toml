[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgt-orchestrator-brownfield"
version = "2.0.0"
description = "Synthetic AI FDE brownfield capstone for Cell & Gene Therapy patient-to-batch orchestration"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["legacy_defect: expected failure documenting a known legacy defect"]
