[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-final-capstone"
version = "1.1.0"
description = "Synthetic CGT patient-to-batch evidence and orchestration capstone"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = ["pytest>=8,<9"]

[project.scripts]
fde-capstone = "fde_capstone.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fde_capstone = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
norecursedirs = ["source_baseline", ".venv"]
