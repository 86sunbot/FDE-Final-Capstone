name: verify-capstone
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,api]'
      - run: python -m ruff check src tests tools
      - run: python -m mypy src
      - run: python -m pytest -q --cov=fde_capstone --cov-report=term-missing --cov-fail-under=94 --junitxml=reports/generated/pytest-results.xml
      - if: matrix.python-version == '3.12'
        run: python tools/summarize_test_results.py
      - if: matrix.python-version == '3.12'
        run: python tools/build_requirement_verification.py
      - if: matrix.python-version == '3.12'
        run: python -m fde_capstone.cli evaluate --db reports/generated/eval-unused.db --output docs/stages/stage_15/evaluation_results.json
      - if: matrix.python-version == '3.12'
        run: python tools/generate_delivery_evidence.py
      - if: matrix.python-version == '3.12'
        run: python tools/verify_final_capstone.py
