name: verify-capstone
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,api]'
      - run: python -m pytest -q
      - run: python tools/verify_final_capstone.py
